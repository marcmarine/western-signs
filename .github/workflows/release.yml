name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "latest"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Debug build output
        run: |
          echo "=== src/data/symbols.ts (primeras 5 líneas) ==="
          head -5 src/data/symbols.ts
          echo "=== dist/ ==="
          ls -la dist/
          echo "=== dist/index.js ==="
          cat dist/index.js
          echo "=== dist/locale/ ==="
          ls -la dist/locale/

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: bun audit --production

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release
